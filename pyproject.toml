[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrtools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["qrcode[pil]"]

[project.scripts]
qrc = "qrtools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 99
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
